name: model_training
display_name: Model Training & Evaluation
version: 1
type: command

inputs:
  train_data:
    type: uri_file
  test_data:
    type: uri_file
  selected_features:
    type: uri_file

outputs:
  metrics:
    type: uri_file

code: .

command: >-
  python run.py
  --train_data ${{inputs.train_data}}
  --test_data ${{inputs.test_data}}
  --selected_features ${{inputs.selected_features}}
  --metrics ${{outputs.metrics}}

environment: azureml:sklearn-1.3:1
